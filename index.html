  <script>
    (function () {
      var supported = ["pt", "en", "es"];
      var pick = null;
      try { pick = localStorage.getItem("phs-lang"); } catch (e) {}
      if (supported.indexOf(pick) === -1) {
        pick = null;
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        for (var i = 0; i < langs.length && !pick; i++) {
          var code = String(langs[i]).slice(0, 2).toLowerCase();
          if (supported.indexOf(code) !== -1) pick = code;
        }
      }
      pick = pick || "en";
      var target = pick + "/" + (location.protocol === "file:" ? "index.html" : "");
      location.replace(target);
    })();
  </script>
