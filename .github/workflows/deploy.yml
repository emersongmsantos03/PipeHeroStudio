name: Publicar na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir chave da Cloudflare
        id: chave
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN nos segredos do repositório: publicação automática desligada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chave.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.chave.outputs.ok == 'true'
      - name: Build e publicação do site
        if: steps.chave.outputs.ok == 'true'
        run: npm run deploy
      - name: Publicação do admin
        if: steps.chave.outputs.ok == 'true'
        run: npm run deploy:admin
